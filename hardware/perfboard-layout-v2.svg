<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
 <defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="3.7" fill="#e6c36b" stroke="#6e571d"/></pattern>
  <style>
   text{font-family:Arial,sans-serif;fill:#182331}.title{font-size:27px;font-weight:700}.sub{font-size:14px}.small{font-size:11px}.lbl{font-size:13px;font-weight:700}.track{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.92}.jump{fill:none;stroke:#00d8ff;stroke-width:5;stroke-dasharray:11 7;stroke-linecap:round}.gnd{stroke:#272727}.v12{stroke:#e63232}.v5{stroke:#ff8b18}.v33{stroke:#b52dcc}.sig{stroke:#1976d2}.motor{stroke:#6b4cc4}.part{fill:#e8edf3;stroke:#17283c;stroke-width:2}.drv{fill:#d84a47;stroke:#6d211f;stroke-width:3}.hdr{fill:#263648;stroke:#101820;stroke-width:2}.coord{font-size:10px;fill:#526277}
  </style>
 </defs>
 <rect width="1400" height="900" fill="#f4f6f9"/>
 <text x="45" y="40" class="title">Perfboard V2 — routing realizable sin cruces de soldadura</text>
 <text x="45" y="64" class="sub">Vista desde COMPONENTES. Las pistas sólidas se sueldan debajo; solamente las líneas celestes punteadas son jumpers aislados por arriba.</text>

 <!-- active area: 32 columns x 24 rows; center(col,row)=(58+24c,78+24r) -->
 <rect x="70" y="90" width="768" height="576" rx="8" fill="#77a875" stroke="#315d36" stroke-width="5"/>
 <rect x="70" y="90" width="768" height="576" fill="url(#grid)"/>
 <g class="coord"><text x="78" y="84">1</text><text x="294" y="84">10</text><text x="534" y="84">20</text><text x="774" y="84">30</text><text x="824" y="84">32</text><text x="54" y="116">1</text><text x="48" y="332">10</text><text x="48" y="572">20</text><text x="48" y="668">24</text></g>

 <!-- solder tracks: drawn first, beneath components -->
 <!-- +12V: JPOWER c27r3, D1 VMOT c11r5, D2 VMOT c23r5 -->
 <path class="track v12" d="M706 150 H322 M322 150 V198 M610 150 V198"/>
 <!-- power GND from ATX to D2. D1 receives it through an insulated jumper. -->
 <path class="track gnd" d="M706 174 H634 V222 H610"/>
 <!-- +5V to servo -->
 <path class="track v5" d="M706 198 V534"/>
 <!-- servo GND, routed at far right -->
 <path class="track gnd" d="M706 174 H778 V510 H706 M778 510 V630 H706"/>

 <!-- D1 MS1/MS2/MS3 locally tied -->
 <path class="track gnd" d="M202 222 V270"/>
 <!-- D2 MS1/MS2/MS3 locally tied -->
 <path class="track gnd" d="M490 222 V270"/>
 <!-- reset/sleep locally tied -->
 <path class="track v33" d="M202 294 V318 M490 294 V318"/>

 <!-- STEP/DIR direct inputs -->
 <path class="track sig" d="M130 342 H202 M130 366 H202 M418 342 H490 M418 366 H490"/>
 <!-- shared ENABLE input reaches D1 directly -->
 <path class="track sig" d="M130 198 H202"/>

 <!-- motor outputs straight to connectors -->
 <path class="track motor" d="M322 246 H394 M322 270 H394 M322 294 H394 M322 318 H394"/>
 <path class="track motor" d="M610 246 H682 M610 270 H682 M610 294 H682 M610 318 H682"/>

 <!-- 3V3 and logic GND from ESP to D1. Distribution to D2 uses insulated jumpers. -->
 <path class="track v33" d="M274 510 V342 H322"/>
 <path class="track gnd" d="M298 510 H346 V366 H322"/>

 <!-- servo PWM: direct ESP pin to servo connector -->
 <path class="track sig" d="M634 558 H706"/>
 <!-- STOP: ESP pin to switch; return goes to existing GND outer route -->
 <path class="track sig" d="M634 606 H706"/>

 <!-- insulated top-side jumpers: the only electrical crossings -->
 <!-- EN D1 to EN D2 -->
 <path class="jump" d="M202 198 C300 110 392 110 490 198"/>
 <!-- MS group to power GND for each driver -->
 <path class="jump" d="M202 222 C235 190 285 190 322 222 M490 222 C525 190 575 190 610 222"/>
 <!-- RESET/SLEEP to VDD for each driver -->
 <path class="jump" d="M202 318 C240 385 285 385 322 342 M490 318 C525 385 575 385 610 342"/>
 <!-- logic supply distribution to D2 -->
 <path class="jump" d="M322 342 C380 455 550 455 610 342 M322 366 C385 500 548 500 610 366"/>
 <!-- motor-power GND distribution, kept off the solder layer to avoid VMOT -->
 <path class="jump" d="M322 222 C385 115 548 115 610 222"/>

 <!-- drivers -->
 <rect class="drv" x="188" y="184" width="148" height="196" rx="5"/><text x="225" y="207" fill="white" style="font-weight:700;font-size:17px">D1 A4988</text><text x="217" y="224" fill="white" class="small">MOTOR CINTA</text>
 <rect class="drv" x="476" y="184" width="148" height="196" rx="5"/><text x="513" y="207" fill="white" style="font-weight:700;font-size:17px">D2 A4988</text><text x="500" y="224" fill="white" class="small">MOTOR TRANSVERSAL</text>
 <g class="small">
  <text x="194" y="202">EN</text><text x="303" y="202">VMOT</text><text x="190" y="226">MS1</text><text x="306" y="226">GND</text><text x="190" y="250">MS2</text><text x="311" y="250">2B</text><text x="190" y="274">MS3</text><text x="311" y="274">2A</text><text x="188" y="298">RST</text><text x="311" y="298">1A</text><text x="188" y="322">SLP</text><text x="311" y="322">1B</text><text x="184" y="346">STEP</text><text x="304" y="346">VDD</text><text x="188" y="370">DIR</text><text x="306" y="370">GND</text>
  <text x="482" y="202">EN</text><text x="591" y="202">VMOT</text><text x="478" y="226">MS1</text><text x="594" y="226">GND</text><text x="478" y="250">MS2</text><text x="599" y="250">2B</text><text x="478" y="274">MS3</text><text x="599" y="274">2A</text><text x="476" y="298">RST</text><text x="599" y="298">1A</text><text x="476" y="322">SLP</text><text x="599" y="322">1B</text><text x="472" y="346">STEP</text><text x="592" y="346">VDD</text><text x="476" y="370">DIR</text><text x="594" y="370">GND</text>
 </g>

 <!-- headers and labels -->
 <rect class="hdr" x="112" y="184" width="36" height="36"/><text x="82" y="176" class="lbl">GPIO22 EN</text>
 <rect class="hdr" x="112" y="328" width="36" height="60"/><text x="77" y="405" class="lbl">GPIO16/17</text><text x="80" y="422" class="small">STEP/DIR CINTA</text>
 <rect class="hdr" x="400" y="328" width="36" height="60"/><text x="385" y="405" class="lbl">GPIO18/19</text><text x="383" y="422" class="small">STEP/DIR X</text>
 <rect class="hdr" x="256" y="492" width="60" height="36"/><text x="234" y="548" class="lbl">ESP32 3V3 / GND</text>
 <rect class="hdr" x="376" y="232" width="36" height="108"/><text x="350" y="360" class="lbl">MOTOR CINTA</text><text x="359" y="378" class="small">2B 2A 1A 1B</text>
 <rect class="hdr" x="664" y="232" width="36" height="108"/><text x="641" y="360" class="lbl">MOTOR X</text><text x="647" y="378" class="small">2B 2A 1A 1B</text>
 <rect class="hdr" x="688" y="132" width="36" height="84"/><text x="735" y="158" class="lbl">ATX</text><text x="735" y="177" class="small">12V / GND / 5V</text>
 <rect class="hdr" x="688" y="492" width="36" height="84"/><text x="735" y="520" class="lbl">SERVO</text><text x="735" y="539" class="small">GND / 5V / PWM</text>
 <rect class="hdr" x="616" y="540" width="36" height="36"/><text x="576" y="588" class="lbl">GPIO21 PWM</text>
 <rect class="hdr" x="616" y="588" width="36" height="36"/><text x="578" y="642" class="lbl">GPIO32 STOP</text>
 <rect class="hdr" x="688" y="588" width="36" height="60"/><text x="735" y="613" class="lbl">BOTÓN NC</text><text x="735" y="632" class="small">STOP / GND</text>

 <!-- capacitors -->
 <circle cx="370" cy="150" r="17" fill="#23467d" stroke="#102444" stroke-width="2"/><text x="360" y="155" fill="white" class="small">C1</text><text x="350" y="125" class="small">100µF / 25V</text>
 <circle cx="562" cy="150" r="17" fill="#23467d" stroke="#102444" stroke-width="2"/><text x="552" y="155" fill="white" class="small">C2</text><text x="542" y="125" class="small">100µF / 25V</text>
 <circle cx="754" cy="534" r="20" fill="#23467d" stroke="#102444" stroke-width="2"/><text x="744" y="539" fill="white" class="small">C5</text><text x="738" y="570" class="small">470–1000µF</text>

 <!-- legend -->
 <g transform="translate(880,95)"><rect width="470" height="570" rx="12" fill="white" stroke="#ccd4df" stroke-width="2"/><text x="24" y="38" class="lbl" style="font-size:19px">Cómo interpretar este plano</text>
  <line x1="25" y1="75" x2="105" y2="75" class="track v12"/><text x="125" y="80">Pista de soldadura +12 V</text>
  <line x1="25" y1="110" x2="105" y2="110" class="track gnd"/><text x="125" y="115">Pista de soldadura GND</text>
  <line x1="25" y1="145" x2="105" y2="145" class="track v33"/><text x="125" y="150">Pista de soldadura 3,3 V</text>
  <line x1="25" y1="180" x2="105" y2="180" class="track sig"/><text x="125" y="185">Pista de señal</text>
  <line x1="25" y1="215" x2="105" y2="215" class="jump"/><text x="125" y="220">Jumper aislado por arriba</text>
  <text x="24" y="270" class="lbl">Cantidad de jumpers: 8</text>
  <text x="24" y="302">J1: EN del driver 1 al EN del driver 2.</text><text x="24" y="329">J2/J3: MS1–MS3 a GND en cada driver.</text><text x="24" y="356">J4/J5: RESET+SLEEP a VDD en cada driver.</text><text x="24" y="383">J6/J7: VDD y GND lógico de D1 hacia D2.</text><text x="24" y="410">J8: GND de potencia de D2 hacia D1.</text>
  <text x="24" y="447" class="lbl">No hay cruces entre pistas sólidas.</text>
  <text x="24" y="475">Las curvas punteadas pueden cruzar pistas porque</text><text x="24" y="497">son cables aislados instalados del lado superior.</text>
  <text x="24" y="535" class="lbl">Área usada: 32 × 24 agujeros</text><text x="24" y="558">Esquina superior izquierda de la placa 50 × 32.</text>
 </g>
 <text x="70" y="715" class="lbl">Antes de soldar:</text><text x="70" y="741">comparar EN/VMOT/STEP/DIR impresos en cada módulo con la orientación mostrada. Los jumpers deben ser cable aislado, nunca puentes de estaño.</text>
 <text x="70" y="773">Las pistas de potencia se realizan con alambre de cobre grueso soldado sobre las islas; no depender de una cadena de pequeñas gotas de estaño.</text>
 <text x="70" y="805">El ESP32 queda fuera de esta placa. Su pin VIN recibe +5 V directamente desde la ATX mediante un cable separado.</text>
</svg>
